<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPG Gas Energy - Portal</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .box { max-width: 400px; background: white; padding: 20px; margin: 50px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d90429; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="authBox" class="box">
        <h2 id="formTitle" style="color: #d90429; text-align: center;">Register</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="number" id="phone" placeholder="Mobile Number">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="submitData()" id="btnText">Register Now</button>
        <p style="text-align: center; cursor: pointer; color: blue; margin-top: 15px;" onclick="toggleMode()">Already have an account? Login</p>
    </div>

    <div id="dashboard" class="box hidden">
        <h2>Welcome, <span id="displayName"></span></h2>
        <h3>Balance: ₹<span id="displayBal">0</span></h3>
        <button onclick="logout()" style="background: #333;">Logout</button>
    </div>

    <script>
        let isReg = true;

        window.onload = function() {
            let savedPhone = localStorage.getItem('user_phone');
            if(savedPhone) {
                db.ref('users/' + savedPhone).once('value', snapshot => {
                    if(snapshot.exists()) {
                        showApp(snapshot.val());
                    }
                });
            }
        };

        function toggleMode() {
            isReg = !isReg;
            document.getElementById('formTitle').innerText = isReg ? 'Register' : 'Login';
            document.getElementById('btnText').innerText = isReg ? 'Register Now' : 'Login Now';
            document.getElementById('name').style.display = isReg ? 'block' : 'none';
        }

        function submitData() {
            let name = document.getElementById('name').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let pass = document.getElementById('pass').value.trim();

            if(!phone || !pass || (isReg && !name)) {
                alert('कृपया सभी जानकारी भरें!');
                return;
            }

            let userRef = db.ref('users/' + phone);

            userRef.once('value', snapshot => {
                if(isReg) {
                    if(snapshot.exists()) {
                        alert('यह नंबर पहले से रजिस्टर है!');
                        return;
                    }
                    let newUser = { name: name, phone: phone, pass: pass, balance: 0 };
                    userRef.set(newUser).then(() => {
                        localStorage.setItem('user_phone', phone);
                        showApp(newUser);
                    });
                } else {
                    if(!snapshot.exists() || snapshot.val().pass !== pass) {
                        alert('गलत नंबर या पासवर्ड!');
                        return;
                    }
                    localStorage.setItem('user_phone', phone);
                    showApp(snapshot.val());
                }
            });
        }

        function showApp(user) {
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('displayName').innerText = user.name;
            document.getElementById('displayBal').innerText = user.balance;
        }

        function logout() {
            localStorage.removeItem('user_phone');
            location.reload();
        }
    </script>
</body>
</html>
