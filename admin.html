<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPG Gas - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #eef2f5; padding: 15px; }
        .header { background: #1d3557; color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h3 { color: #1d3557; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-primary { background: #1d3557; width: 100%; }
        .btn-approve { background: #2a9d8f; margin-right: 5px; }
        .btn-reject { background: #d90429; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .badge { padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .pending { background: #fff3cd; color: #856404; }
        .approved { background: #d4edda; color: #155724; }
        .rejected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>🔥 LPG Gas Admin Panel</h2>
            <small>Live Database Management</small>
        </div>
        <a href="index.html" style="color:white; background:#d90429; padding:8px 12px; border-radius:6px; text-decoration:none; font-weight:bold;">Go to Website</a>
    </div>

    <div class="card">
        <h3>1. Update Payment QR & UPI ID</h3>
        <div class="input-group">
            <label>Admin UPI ID</label>
            <input type="text" id="adminUpiInput" placeholder="merchant@upi">
        </div>
        <div class="input-group">
            <label>QR Code Image URL</label>
            <input type="text" id="adminQrUrlInput" placeholder="https://link-to-qr.jpg">
        </div>
        <button class="btn btn-primary" onclick="saveQrSettings()">Save QR Settings</button>
    </div>

    <div class="card" style="overflow-x:auto;">
        <h3>2. Recharge & Withdrawal Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Details</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="txTableBody"></tbody>
        </table>
    </div>

    <div class="card" style="overflow-x:auto;">
        <h3>3. Registered Users Log</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Balance</th>
                    <th>Plans</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <script>
        window.onload = () => {
            db.ref('admin/qrSettings').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('adminUpiInput').value = data.upiId || '';
                    document.getElementById('adminQrUrlInput').value = data.qrUrl || '';
                }
            });
            loadTransactions();
            loadUsers();
        };

        function saveQrSettings() {
            const upiId = document.getElementById('adminUpiInput').value.trim();
            const qrUrl = document.getElementById('adminQrUrlInput').value.trim();
            db.ref('admin/qrSettings').set({ upiId, qrUrl }).then(() => {
                alert('QR Settings Updated Successfully!');
            });
        }

        function loadTransactions() {
            db.ref('transactions').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('txTableBody');
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No requests.</td></tr>';
                    return;
                }
                let html = '';
                Object.keys(data).forEach(key => {
                    let t = data[key];
                    html += `
                    <tr>
                        <td><b>${t.userName}</b><br><small>${t.userPhone}</small></td>
                        <td><b style="color:${t.type === 'Recharge' ? 'green' : '#d90429'}">${t.type}</b></td>
                        <td>₹${t.amount}</td>
                        <td>${t.details}</td>
                        <td><span class="badge ${t.status.toLowerCase()}">${t.status}</span></td>
                        <td>
                            ${t.status === 'Pending' ? `
                                <button class="btn btn-approve" onclick="processTx('${key}', 'Approved', '${t.userPhone}', ${t.amount}, '${t.type}')">Approve</button>
                                <button class="btn btn-reject" onclick="processTx('${key}', 'Rejected', '${t.userPhone}', ${t.amount}, '${t.type}')">Reject</button>
                            ` : 'Done'}
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            });
        }

        function processTx(txId, status, userPhone, amount, type) {
            db.ref('transactions/' + txId).update({ status: status });

            if (status === 'Approved' && type === 'Recharge') {
                db.ref('users/' + userPhone + '/balance').once('value', (snapshot) => {
                    let currentBal = snapshot.val() || 0;
                    db.ref('users/' + userPhone).update({ balance: currentBal + amount });
                });
            } else if (status === 'Rejected' && type === 'Withdraw') {
                db.ref('users/' + userPhone + '/balance').once('value', (snapshot) => {
                    let currentBal = snapshot.val() || 0;
                    db.ref('users/' + userPhone).update({ balance: currentBal + amount });
                });
            }
            alert('Request ' + status);
        }

        function loadUsers() {
            db.ref('users').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('usersTableBody');
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No users registered.</td></tr>';
                    return;
                }
                let html = '';
                Object.values(data).forEach(u => {
                    let planNames = (u.purchasedPlans || []).map(p => p.name).join(', ') || 'None';
                    html += `
                    <tr>
                        <td><b>${u.name}</b></td>
                        <td>${u.phone}</td>
                        <td><b>₹${u.balance || 0}</b></td>
                        <td>${planNames}</td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            });
        }
    </script>
</body>
</html>
